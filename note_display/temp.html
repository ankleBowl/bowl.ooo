<html>
<head>
    <title>Wifi</title>
</head>
<style>
    @import url('https://use.typekit.net/jmr4hbb.css');
    @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap');

    :root {
        --lye-wheat: #E4E1D7;
        --lye-green: #8EA78A;
        --lye-green-dark: #73876F;
    }


    body {

        margin: 0;
        
        width: 100%;
        height: 100%;

        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 30px;

        background-color: var(--lye-wheat);
    }

    h1 {
        margin: 0;
        color: black;
        font-family: 'lora', serif;
    }

    .inset-box {
        background-color: white;
        box-shadow: inset 0 0 10px #00000050 inset;
        border-radius: 25px;

        max-width: 400px;
        width: 90vw;

        overflow: hidden;
        
    }

    .inset-box > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;

        padding: 20px;
        box-sizing: border-box;

        width: 100%;
    }

    input {
        width: 100%;
        height: 50px;
        font-size: 18px;
        font-family: 'filson-pro', sans-serif;

        border: none;
        border-bottom: 2px solid var(--lye-green-dark);
    }

    button {
        width: 100%;
        padding: 10px;
        border: none;
        height: 50px;
        font-size: 18px;
        font-family: 'filson-pro', sans-serif;
        color: white;

        background-color: var(--lye-green);
    }
</style>
<body>
    <h1>Connect to Wifi</h1>
    <div class='inset-box'>
        <div>
            <input type='text' placeholder='SSID'>
            <input type='password' placeholder='Password'>
        </div>
        <button>Connect</button>
    </div>
</body>
<script>const button = document.querySelector('button'); button.addEventListener('click', () => { const ssid = document.querySelector('input[type=\'text\']').value; const password = document.querySelector('input[type=\'password\']').value; const data = `${ssid}|${password}`; fetch('/credentials', { method: 'POST', body: data }).then(response => { window.close(); }); });</script>
</html>
